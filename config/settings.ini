[nutanix]
# Nutanix Prism Central API endpoint
# Example: https://prism-central.example.com:9440
api_endpoint = https://prism-central.example.com:9440
username = admin
password = CHANGE_ME
# Comma-separated list of subnet UUIDs to monitor for new VMs
# Example: uuid1,uuid2,uuid3
monitored_subnets = subnet-uuid-1,subnet-uuid-2
# Whether to verify SSL certificates (true/false)
verify_ssl = false

[panorama]
# Panorama management IP or FQDN
host = panorama.example.com
api_key = CHANGE_ME
# Template name containing the TS-Agent configuration
template_name = GLOBAL
# User-ID group mapping profile name
group_mapping_profile = USER-GRO-MAP-PRO
# Domain suffix appended to hostname for TS-Agent host address
domain_suffix = xyz.com
# Whether to verify SSL certificates (true/false)
verify_ssl = false

[firewall]
# Sample firewall IP or FQDN to verify TS-Agent connectivity after push
sample_firewall_host = firewall-sample.example.com
sample_firewall_api_key = CHANGE_ME
verify_ssl = false

[paths]
# Path to the previous VM inventory (auto-managed, do not edit)
previous_inventory = output/nutanix_reports/previous_vm_inventory.json
# Path to the latest discovered VMs CSV
nutanix_report_dir = output/nutanix_reports
panorama_report_dir = output/panorama_reports
